#vim: ft=tmux

# -----------------------------------------------------------------------------
# Section: Terminal environment
# - Inherit the default shell and its PATH without host-specific adjustments
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -g focus-events on
set -ga terminal-overrides ",*:Tc"

# -----------------------------------------------------------------------------
# Section: Status bar (global style)
# - Alignment, colours, refresh interval
# -----------------------------------------------------------------------------
set-option -g status-justify centre
set-option -g status-bg default
set-option -g status-style 'bg=default'
set-option -g status-interval 120
set-option -g status 2
set-option -g status-position bottom
set-option -g status-format[0] '#[bg=default,fg=colour240]#{R:═,#{client_width}}'
set-option -g status-format[1] '\
#[align=left range=left]#[push-default]#{T;=/#{status-left-length}:status-left}\
#[pop-default]#[norange default]\
#[align=right range=right]#[push-default]#{T;=/#{status-right-length}:status-right}\
#[pop-default]#[norange default]'

# Hide default window status strings; we craft custom ones later
set-window-option -g window-status-format ' '
set-window-option -g window-status-current-format ' '

# -----------------------------------------------------------------------------
# Section: Pane borders
# - Subtle grey lines, slightly brighter for the active pane
# - Show the pane number, TTY and path in the top border
# -----------------------------------------------------------------------------
set -g pane-active-border-style 'bg=default,fg=colour244'
set-option -g pane-border-status top
set-option -g pane-border-lines double
set-option -g pane-border-indicators off
set -g pane-border-style 'bg=default,fg=colour240'
set -g @pane_border_details '\
 #[bg=default]#{?pane_active,#[fg=colour67],#[fg=colour60]}\
#{?pane_active,#[bg=colour67]#[fg=colour255],#[bg=colour60]#[fg=colour250]} #{e|+:#{pane_index},1} \
#[bg=default]#{?pane_active,#[fg=colour67],#[fg=colour60]}\
#[bg=default]#[fg=colour247]#[nobold] #{pane_tty} | #{pane_current_path} '
set-window-option -g pane-border-format '#{E:@pane_border_details}'

# -----------------------------------------------------------------------------
# Section: Status-left
# - Shows prefix/SSH indicators, session number/count and pane commands
# - The arrow colour indicates whether the prefix is active
# -----------------------------------------------------------------------------
set-option -g status-left-length 120

set -g @pane_command_format '\
#[bg=default]#{?pane_active,#[fg=colour67],#[fg=colour60]}#[reverse]#[noreverse]\
#{?pane_active,#[bg=colour67]#[fg=colour255],#[bg=colour60]#[fg=colour250]}\
 #{e|+:#{pane_index},1}: #{pane_current_command} \
#[bg=default]#{?pane_active,#[fg=colour67],#[fg=colour60]}'

# Order the nine numbered slots explicitly for compatibility with tmux 3.6a.
set -g @pane_command_list '\
#{P:#{?#{==:#{pane_index},0},#{E:@pane_command_format},}}\
#{P:#{?#{==:#{pane_index},1},#{E:@pane_command_format},}}\
#{P:#{?#{==:#{pane_index},2},#{E:@pane_command_format},}}\
#{P:#{?#{==:#{pane_index},3},#{E:@pane_command_format},}}\
#{P:#{?#{==:#{pane_index},4},#{E:@pane_command_format},}}\
#{P:#{?#{==:#{pane_index},5},#{E:@pane_command_format},}}\
#{P:#{?#{==:#{pane_index},6},#{E:@pane_command_format},}}\
#{P:#{?#{==:#{pane_index},7},#{E:@pane_command_format},}}\
#{P:#{?#{==:#{pane_index},8},#{E:@pane_command_format},}}\
#{P:#{?#{>=:#{pane_index},9},#{E:@pane_command_format},}}'

set -g status-left '\
#{?client_prefix,#[bg=colour129],#[bg=colour198]}  \
#[bg=default]#{?client_prefix,#[fg=colour129],#[fg=colour198]}\
#[bg=default] \
#[bg=default,fg=colour239,reverse]#[noreverse]\
#[bg=colour239,fg=colour248] #S/#{server_sessions} \
#[bg=default,fg=colour239]\
#{?SSH_CONNECTION,#[bg=default]#[fg=colour215]#[reverse] #[noreverse]#[bg=default]#[fg=colour215],#[bg=default]   }\
#[bg=default] #{E:@pane_command_list}'

# -----------------------------------------------------------------------------
# Section: Status-right
# - Git state, network menu and date/time
# -----------------------------------------------------------------------------
set-option -g status-right-length 120
set-option -g status-right '\
#[range=user|git,bg=default,fg=colour238]\
#[bg=colour238,fg=colour248] #(sh ~/.config/tmux/module/git-status.sh --tmux #{q:pane_current_path}) \
#[range=user|network,bg=colour238,fg=colour239]\
#[bg=colour239,fg=colour248] NET \
#[range=right,bg=colour239,fg=colour238]\
#[bg=colour238,fg=colour153] #(sh ~/.config/tmux/module/date-time.sh) \
#[bg=default,fg=colour255]'

# -----------------------------------------------------------------------------
# Section: Interaction & terminal
# - Vi keys in copy-mode, OSC52 clipboard, mouse, 256 colours, renumbering
# -----------------------------------------------------------------------------
set-window-option -g mode-keys vi
set-option -g set-clipboard on
set-option -ga terminal-overrides ",*:Ms=\\E]52;%p1%s;%p2%s\\007"
set-option -g allow-passthrough on
set-option -g mouse on
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g renumber-windows off

# -----------------------------------------------------------------------------
# Section: Key bindings (disabled window operations)
# -----------------------------------------------------------------------------
unbind-key -q c
unbind-key -q n
unbind-key -q p
unbind-key -q w
unbind-key -q '!'
unbind-key -q '&'
unbind-key -q "'"
unbind-key -q ','
unbind-key -q '.'
unbind-key -q '<'
unbind-key -q f
unbind-key -q 0
unbind-key -q 1
unbind-key -q 2
unbind-key -q 3
unbind-key -q 4
unbind-key -q 5
unbind-key -q 6
unbind-key -q 7
unbind-key -q 8
unbind-key -q 9
unbind-key -q M-n
unbind-key -q M-p
unbind-key -q Tab
unbind-key -q BTab
unbind-key -qn MouseDown3Status
unbind-key -qn M-MouseDown3Status
unbind-key -qn C-MouseDown1Status
unbind-key -qn WheelUpStatus
unbind-key -qn WheelDownStatus
unbind-key -qn MouseDown3Empty
unbind-key -qn M-MouseDown3Empty

# -----------------------------------------------------------------------------
# Section: Key bindings (utility)
# - Reload config and prefix passthrough
# -----------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind C-b send-prefix

bind-key g run-shell -b \
    'sh ~/.config/tmux/module/git-menu.sh #{q:client_name} R #{q:pane_current_path}'
bind-key n run-shell -b \
    'sh ~/.config/tmux/module/network-menu.sh #{q:client_name} R'

# Only the information blocks react to status clicks.
bind-key -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},network}' \
    'run-shell -b "sh ~/.config/tmux/module/network-menu.sh #{q:client_name} #{mouse_x}"' \
    { if-shell -F '#{==:#{mouse_status_range},git}' \
        'run-shell -b "sh ~/.config/tmux/module/git-menu.sh #{q:client_name} #{mouse_x} #{q:pane_current_path}"' }

# -----------------------------------------------------------------------------
# Section: Key bindings (pane focus)
# - Vim-like hjkl for pane selection
# -----------------------------------------------------------------------------
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Swap using the same one-based numbers as the pane labels.
bind-key x switch-client -T pane-swap
bind-key -T pane-swap x if-shell -F '#{>:#{window_panes},1}' \
    'swap-pane -d -s "{active}" -t ".{next}"'
bind-key -T pane-swap 1 if-shell -F '#{>=:#{window_panes},1}' \
    'swap-pane -d -s "{active}" -t ".0"'
bind-key -T pane-swap 2 if-shell -F '#{>=:#{window_panes},2}' \
    'swap-pane -d -s "{active}" -t ".1"'
bind-key -T pane-swap 3 if-shell -F '#{>=:#{window_panes},3}' \
    'swap-pane -d -s "{active}" -t ".2"'
bind-key -T pane-swap 4 if-shell -F '#{>=:#{window_panes},4}' \
    'swap-pane -d -s "{active}" -t ".3"'
bind-key -T pane-swap 5 if-shell -F '#{>=:#{window_panes},5}' \
    'swap-pane -d -s "{active}" -t ".4"'
bind-key -T pane-swap 6 if-shell -F '#{>=:#{window_panes},6}' \
    'swap-pane -d -s "{active}" -t ".5"'
bind-key -T pane-swap 7 if-shell -F '#{>=:#{window_panes},7}' \
    'swap-pane -d -s "{active}" -t ".6"'
bind-key -T pane-swap 8 if-shell -F '#{>=:#{window_panes},8}' \
    'swap-pane -d -s "{active}" -t ".7"'
bind-key -T pane-swap 9 if-shell -F '#{>=:#{window_panes},9}' \
    'swap-pane -d -s "{active}" -t ".8"'
bind-key -T pane-swap Escape switch-client -T root
bind-key -T pane-swap Any switch-client -T root

# -----------------------------------------------------------------------------
# Section: Key bindings (pane resize)
# - Shifted HJKL grow/shrink panes in steps
# -----------------------------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------------------------------
# Section: Key bindings (sessions)
# -----------------------------------------------------------------------------
bind-key C-n new-session -c "$HOME"
unbind-key -q '$'
unbind-key -q F12
bind-key s run-shell -b 'sh ~/.config/tmux/module/session-menu.sh #{q:client_name} C'
bind-key -n MouseDown3StatusLeft run-shell -b \
    'sh ~/.config/tmux/module/session-menu.sh #{q:client_name} #{mouse_x}'
bind-key -n M-MouseDown3StatusLeft run-shell -b \
    'sh ~/.config/tmux/module/session-menu.sh #{q:client_name} #{mouse_x}'

# -----------------------------------------------------------------------------
# Section: Key bindings (splits)
# - Honour current pane path and offer quick small splits
# -----------------------------------------------------------------------------
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -l 25% -c "#{pane_current_path}"
bind '_' split-window -v -l 20% -c "#{pane_current_path}"
bind '=' split-window -v -l 3 -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Section: Hooks
# - Keep session numbers dense by renumbering on create/close
# -----------------------------------------------------------------------------
set-hook -g session-created \
    'run-shell -b "sh ~/.config/tmux/module/renumber-session.sh #{q:socket_path}"'
set-hook -g session-closed \
    'run-shell -b "sh ~/.config/tmux/module/renumber-session.sh #{q:socket_path}"'

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
